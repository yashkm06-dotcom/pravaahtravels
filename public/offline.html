<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Pravaah Travels</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fffaf1;
        color: #1f2937;
      }
      .card {
        max-width: 560px;
        margin: 8vh auto;
        padding: 2rem;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      h1 { margin-bottom: 0.75rem; font-size: 1.5rem; }
      p { line-height: 1.6; color: #4b5563; }
      a { color: #4DA528; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>Your last visit to Pravaah Travels is available locally, and the app will sync again when your connection returns.</p>
      <p><a href="/">Try the home page again</a></p>
    </main>
  </body>
</html>
