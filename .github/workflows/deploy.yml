name: Validate and deploy Firebase environments

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_APP_ENV: staging
      VITE_STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.STAGING_FIREBASE_DATABASE_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.STAGING_FIREBASE_MEASUREMENT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:staging
      - run: npm ci
        working-directory: functions
      - run: npm audit --omit=dev
        working-directory: functions
      - run: npx tsc --noEmit
        working-directory: functions
      - name: Block production project from staging
        run: |
          test -n "$VITE_STAGING_FIREBASE_PROJECT_ID"
          test "$VITE_STAGING_FIREBASE_PROJECT_ID" != "zealous-theory-q09p9"
          test "$VITE_STAGING_FIREBASE_PROJECT_ID" = "pravaah-travels-test"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      - run: npm install -g firebase-tools
      - name: Deploy staging only
        run: firebase deploy --project "$VITE_STAGING_FIREBASE_PROJECT_ID" --config firebase.staging.json --only hosting,functions,firestore,storage --non-interactive

  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_FIREBASE_PROJECT_ID: zealous-theory-q09p9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:production
      - run: npm ci
        working-directory: functions
      - run: npm audit --omit=dev
        working-directory: functions
      - run: npx tsc --noEmit
        working-directory: functions
      - name: Verify production project
        run: test "$PRODUCTION_FIREBASE_PROJECT_ID" = "zealous-theory-q09p9"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - run: npm install -g firebase-tools
      - name: Deploy production only
        run: firebase deploy --project "$PRODUCTION_FIREBASE_PROJECT_ID" --config firebase.production.json --only hosting,functions,firestore,storage --non-interactive
