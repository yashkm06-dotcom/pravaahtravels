name: Validate and deploy Firebase environments

on:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # STAGING
  # ============================================================
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    env:
      VITE_APP_ENV: staging
      VITE_STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.STAGING_FIREBASE_DATABASE_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.STAGING_FIREBASE_MEASUREMENT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build staging
        run: npm run build:staging

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Audit functions dependencies
        run: npm audit --omit=dev
        working-directory: functions

      - name: Type check functions
        run: npx tsc --noEmit
        working-directory: functions

      # ----------------------------------------------------------
      # Safety check: staging MUST NOT be production
      # ----------------------------------------------------------
      - name: Block production project from staging
        run: |
          test -n "$VITE_STAGING_FIREBASE_PROJECT_ID"
          test "$VITE_STAGING_FIREBASE_PROJECT_ID" != "zealous-theory-q09p9"
          test "$VITE_STAGING_FIREBASE_PROJECT_ID" = "pravaah-travels-test"

      # ----------------------------------------------------------
      # STAGING AUTH
      # IMPORTANT:
      # Only credentials_json is used here.
      # DO NOT add workload_identity_provider here.
      # ----------------------------------------------------------
      - name: Authenticate to Google Cloud - Staging
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy staging
        run: |
          firebase deploy \
            --project "$VITE_STAGING_FIREBASE_PROJECT_ID" \
            --config firebase.staging.json \
            --only hosting,functions,firestore,storage \
            --non-interactive


  # ============================================================
  # PRODUCTION
  # ============================================================
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    # REQUIRED FOR WORKLOAD IDENTITY FEDERATION
    permissions:
      contents: read
      id-token: write

    env:
      PRODUCTION_FIREBASE_PROJECT_ID: zealous-theory-q09p9

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build:production

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Audit functions dependencies
        run: npm audit --omit=dev
        working-directory: functions

      - name: Type check functions
        run: npx tsc --noEmit
        working-directory: functions

      # ----------------------------------------------------------
      # Safety check: production MUST be production project
      # ----------------------------------------------------------
      - name: Verify production project
        run: |
          test "$PRODUCTION_FIREBASE_PROJECT_ID" = "zealous-theory-q09p9"

      # ----------------------------------------------------------
      # PRODUCTION AUTH
      # IMPORTANT:
      # Only workload_identity_provider + service_account
      # are used here.
      # DO NOT add credentials_json here.
      # ----------------------------------------------------------
      - name: Authenticate to Google Cloud - Production
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy production
        run: |
          firebase deploy \
            --project "$PRODUCTION_FIREBASE_PROJECT_ID" \
            --config firebase.production.json \
            --only hosting,functions,firestore,storage \
            --non-interactive
