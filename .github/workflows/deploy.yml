name: Validate and deploy Firebase environments

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: firebase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # STAGING
  # ============================================================
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      id-token: write

    env:
      VITE_APP_ENV: staging

      # Staging project is fixed intentionally.
      # This prevents an empty/misconfigured secret from stopping the build.
      VITE_STAGING_FIREBASE_PROJECT_ID: pravaah-travels-test
      VITE_FIREBASE_PROJECT_ID: pravaah-travels-test

      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_ID: ${{ secrets.STAGING_FIREBASE_DATABASE_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.STAGING_FIREBASE_MEASUREMENT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build staging
        run: npm run build:staging

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Audit functions dependencies
        run: npm audit --omit=dev
        working-directory: functions

      - name: Type check functions
        run: npx tsc --noEmit
        working-directory: functions

      - name: Verify staging project
        run: |
          test "$VITE_STAGING_FIREBASE_PROJECT_ID" = "pravaah-travels-test"
          test "$VITE_STAGING_FIREBASE_PROJECT_ID" != "zealous-theory-q09p9"

      # ----------------------------------------------------------
      # WIF AUTH - STAGING
      # ----------------------------------------------------------
      - name: Authenticate to Google Cloud - Staging
        uses: google-github-actions/auth@v3
        with:
          project_id: pravaah-travels-test
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # Temporary identity verification.
      # Keep this for now so we can see the actual authenticated
      # service account in the GitHub Actions log.
      - name: Verify staging Google identity
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: pravaah-travels-test

      - name: Show staging identity
        run: |
          echo "Authenticated service account:"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

          echo "Google Cloud project:"
          gcloud config get-value project

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy staging
        run: |
          firebase deploy \
            --project "pravaah-travels-test" \
            --config firebase.staging.json \
            --only hosting,functions,firestore,storage \
            --non-interactive


  # ============================================================
  # PRODUCTION
  # ============================================================
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      PRODUCTION_FIREBASE_PROJECT_ID: zealous-theory-q09p9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production
        run: npm run build:production

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Audit functions dependencies
        run: npm audit --omit=dev
        working-directory: functions

      - name: Type check functions
        run: npx tsc --noEmit
        working-directory: functions

      - name: Verify production project
        run: |
          test "$PRODUCTION_FIREBASE_PROJECT_ID" = "zealous-theory-q09p9"

      # ----------------------------------------------------------
      # WIF AUTH - PRODUCTION
      # ----------------------------------------------------------
      - name: Authenticate to Google Cloud - Production
        uses: google-github-actions/auth@v3
        with:
          project_id: zealous-theory-q09p9
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy production
        run: |
          firebase deploy \
            --project "zealous-theory-q09p9" \
            --config firebase.production.json \
            --only hosting,functions,firestore,storage \
            --non-interactive
